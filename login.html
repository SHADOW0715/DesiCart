<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DesiCart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p id="login-error" class="error-message"></p>
            <p class="toggle-form">Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <div class="register-box" style="display: none;">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <p id="register-error" class="error-message"></p>
            <p class="toggle-form">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
